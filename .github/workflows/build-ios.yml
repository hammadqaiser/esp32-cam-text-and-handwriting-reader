name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: esp32-text-app/package-lock.json

      - name: Install Dependencies
        working-directory: esp32-text-app
        run: npm ci

      - name: Build Web Assets
        working-directory: esp32-text-app
        run: npm run build

      - name: Sync Capacitor iOS
        working-directory: esp32-text-app
        run: npx cap sync ios

      - name: Build Xcode Project
        working-directory: esp32-text-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO

      - name: Export Payload to IPA
        working-directory: esp32-text-app/ios/App
        run: |
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r ESP32-Text-Reader-unsigned.ipa Payload

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-Text-Reader-iOS
          path: esp32-text-app/ios/App/ESP32-Text-Reader-unsigned.ipa
